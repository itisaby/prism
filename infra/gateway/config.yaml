# agentgateway v1.6.0 — PRISM's governance layer in front of its curated MCP servers (k8s, event DB, GitHub, Stripe, Sentry).
# Reads are allow-listed. Every other tools/call needs an x-prism-approval JWT (ES256, signed by PRISM when a person
# approves) whose `tool` matches the call and whose `argsBody` is exactly the request's "arguments" object.
# A denied call returns HTTP 400 (JSON-RPC -32602 "Unknown tool") and is visible in the access log.
config:
  adminAddr: 0.0.0.0:15000
  # Writable state on the prism-gw-data volume: the request log (UI Logs page) and the UI config overlay.
  # LLM routes/models are UI-managed (see llm-model.sh); defining them here too conflicts with the overlay.
  database:
    url: /data/agentgateway.db
  logging:
    database:
      url: /data/agentgateway.db
  storage:
    mode: hybrid
  # Traces for every MCP and LLM request → OpenTelemetry Collector (prism-otel) → Jaeger + Sentry.
  tracing:
    otlpEndpoint: http://host.docker.internal:4319
    otlpProtocol: grpc
    randomSampling: 'true'
    fields:
      add:
        prism.user: '"x-prism-user" in request.headers ? request.headers["x-prism-user"] : "anonymous"'
  # Columns on the Logs page: who asked, and what kind of call it was.
  standardAttributes:
    user: '"x-prism-user" in request.headers ? request.headers["x-prism-user"] : "anonymous"'
    group: 'request.path.startsWith("/v1/") ? "LLM" : default(has(mcp.tool.name) ? "MCP " + mcp.methodName + ": " + mcp.tool.name : "MCP " + mcp.methodName, "MCP")'
binds:
- port: 7200
  listeners:
  # Named "llm" on purpose: agentgateway v1.6.0's log store only records LLM traffic or this listener name.
  - name: llm
    routes:
    - name: k8s
      matches:
      - path:
          pathPrefix: /k8s
      policies:
        jwtAuth:
          mode: optional
          issuer: prism
          audiences: [agentgateway]
          jwks:
            file: /config/approval-jwks.json
          location:
            header:
              name: x-prism-approval
        mcpAuthorization:
          rules:
          - require: >-
              mcp.methodName != "tools/call"
              || mcp.tool.name in ["cluster_overview", "list_deployments", "list_pods", "list_events",
                                   "get_pod_logs", "get_usage", "get_usage_history", "describe_deployment", "list_services"]
              || (jwt.tool == mcp.tool.name
                  && string(request.body).contains(jwt.argsBody)
                  && size(string(request.body).split("\"arguments\":")) == 2)
      backends:
      - mcp:
          targets:
          - name: k8s
            mcp:
              host: http://host.docker.internal:7300/mcp
    - name: event
      matches:
      - path:
          pathPrefix: /event
      policies:
        jwtAuth:
          mode: optional
          issuer: prism
          audiences: [agentgateway]
          jwks:
            file: /config/approval-jwks.json
          location:
            header:
              name: x-prism-approval
        mcpAuthorization:
          rules:
          - require: >-
              mcp.methodName != "tools/call"
              || mcp.tool.name.matches("^(event_overview|list_[a-z_]+|get_[a-z_]+)$")
              || (jwt.tool == mcp.tool.name
                  && string(request.body).contains(jwt.argsBody)
                  && size(string(request.body).split("\"arguments\":")) == 2)
      backends:
      - mcp:
          targets:
          - name: event
            mcp:
              host: http://host.docker.internal:7101/mcp
    - name: github
      matches:
      - path:
          pathPrefix: /github
      policies:
        jwtAuth:
          mode: optional
          issuer: prism
          audiences: [agentgateway]
          jwks:
            file: /config/approval-jwks.json
          location:
            header:
              name: x-prism-approval
        mcpAuthorization:
          rules:
          - require: >-
              mcp.methodName != "tools/call"
              || mcp.tool.name.matches("^((get|list|search)_[a-z_]+|[a-z_]+_read)$")
              || (jwt.tool == mcp.tool.name
                  && string(request.body).contains(jwt.argsBody)
                  && size(string(request.body).split("\"arguments\":")) == 2)
      backends:
      - mcp:
          targets:
          - name: github
            mcp:
              host: https://api.githubcopilot.com/mcp/
    - name: stripe
      matches:
      - path:
          pathPrefix: /stripe
      policies:
        jwtAuth:
          mode: optional
          issuer: prism
          audiences: [agentgateway]
          jwks:
            file: /config/approval-jwks.json
          location:
            header:
              name: x-prism-approval
        mcpAuthorization:
          rules:
          - require: >-
              mcp.methodName != "tools/call"
              || mcp.tool.name.matches("^(list|retrieve|search|get|fetch)_[a-z_]+$")
              || (jwt.tool == mcp.tool.name
                  && string(request.body).contains(jwt.argsBody)
                  && size(string(request.body).split("\"arguments\":")) == 2)
      backends:
      - mcp:
          targets:
          - name: stripe
            mcp:
              host: https://mcp.stripe.com
    - name: sentry
      matches:
      - path:
          pathPrefix: /sentry
      policies:
        jwtAuth:
          mode: optional
          issuer: prism
          audiences: [agentgateway]
          jwks:
            file: /config/approval-jwks.json
          location:
            header:
              name: x-prism-approval
        mcpAuthorization:
          rules:
          - require: >-
              mcp.methodName != "tools/call"
              || mcp.tool.name.matches("^(whoami|(find|get|search|list)_[a-z_]+)$")
              || (jwt.tool == mcp.tool.name
                  && string(request.body).contains(jwt.argsBody)
                  && size(string(request.body).split("\"arguments\":")) == 2)
      backends:
      - mcp:
          targets:
          - name: sentry
            mcp:
              host: http://host.docker.internal:7102/mcp
